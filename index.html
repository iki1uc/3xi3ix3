<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3xi3ix3 · ULTRA-KERNEL · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
h1, h2 { color:#6cf; }
pre { background:#111; border:1px solid #333; padding:10px; margin-bottom:20px; }
.console { background:#111; border:1px solid #444; padding:10px; white-space:pre-wrap; }
canvas { background:#111; border:1px solid #333; margin-top:20px; }
</style>
</head>

<body>

<h1>3xi3ix3 · ULTRA-KERNEL</h1>

<pre>
CORE     = iki1uc
KERNEL   = ULTRA-6a6y6out
ENGINE   = 3xi3ix3
STATE    = ACTIVE
READY    = 100%
</pre>

<h2>Engine‑Konsole</h2>
<div id="engineOut" class="console">Engine wird geladen…</div>

<h2>Tri‑Hexa‑Orbit Renderer</h2>
<canvas id="orbitCanvas" width="500" height="500"></canvas>

<script type="module">

// ======================================================
// IMPORT — ALLE MODULE AUS DEM REPO
// ======================================================
import { KIT } from "./kit.js";
import { SLI_PORT } from "./SLI-CORE.js";
import { SLI_MASTER } from "./sli.js";
import { SYN } from "./SYN.js";
import { QUANT } from "./QUANT.js";
import { QUO } from "./QUO.js";
import { PYRAMIDE } from "./PYRAMIDE.js";

// ======================================================
// ANIME-QUANT — NEU
// ======================================================
const ANIME_QUANT = {
  frames: [
    "ANIME-FRAME-01",
    "ANIME-FRAME-02",
    "ANIME-FRAME-03",
    "ANIME-FRAME-04",
    "ANIME-FRAME-05",
    "ANIME-FRAME-06",
    "ANIME-FRAME-07",
    "ANIME-FRAME-08",
    "ANIME-FRAME-09"
  ],
  get(t){
    const idx = Math.floor((t * 10) % this.frames.length);
    return {
      anime: this.frames[idx],
      index: idx,
      axis: "ANIME-QUANT",
      mode: "ULTRA-ANIME"
    };
  }
};

// ======================================================
// ULTRA-PORT — NEU
// ======================================================
const ULTRA_PORT = {
  IN: { ID:"ULTRA-6a6y6out", MODE:"ULTRA-IN", PORT:"BOOST-IN" },
  OUT:{ ID:"ULTRA-6a6y6out", MODE:"ULTRA-OUT", PORT:"BOOST-OUT" },

  flow(x){
    return {
      id: this.IN.ID,
      mode: this.IN.MODE,
      in: this.IN.PORT,
      out: this.OUT.PORT,

      a: KIT.AXIOM["6a"](x),
      y: KIT.AXIOM["6y"](x, x),
      iy: KIT.AXIOM["6iy"](x),
      outState: KIT.AXIOM["6out"](x),

      ultra: KIT.ULTRA,
      axis: "ORG-REORG-NC",
      state: "ULTRA-PORT"
    };
  }
};

// ======================================================
// CANVAS SETUP
// ======================================================
const out = document.getElementById("engineOut");
const canvas = document.getElementById("orbitCanvas");
const ctx = canvas.getContext("2d");

let t = 0;

// ======================================================
// ORBIT-RENDERER — NEU
// ======================================================
function renderOrbit(t){

  const qAnime = ANIME_QUANT.get(t);
  const ultraFlow = ULTRA_PORT.flow(t);

  ctx.clearRect(0,0,500,500);

  const x = 250 + Math.sin(t) * 120;
  const y = 250 + Math.cos(t) * 120;

  ctx.fillStyle = "#0f0";
  ctx.beginPath();
  ctx.arc(x, y, 20, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#6cf";
  ctx.font = "16px Consolas";
  ctx.fillText(qAnime.anime, x - 40, y - 30);

  ctx.fillStyle = "#0f0";
  ctx.font = "12px Consolas";
  ctx.fillText("ULTRA: " + ultraFlow.outState.tag, x - 40, y + 40);
}

// ======================================================
// PX-PC-GHOST VISUALISIERUNG — NEU
// ======================================================
function renderDevices(t){

  const devices = ["PX","PC","GHOST"];
  const baseX = 50;
  const baseY = 420;

  devices.forEach((dev, i) => {

    const dx = baseX + i * 150;
    const dy = baseY;

    ctx.fillStyle = "#333";
    ctx.fillRect(dx, dy, 120, 40);

    ctx.fillStyle = "#0f0";
    ctx.font = "14px Consolas";
    ctx.fillText(dev, dx + 10, dy + 25);

    ctx.strokeStyle = "#6cf";
    ctx.beginPath();
    ctx.moveTo(dx + 120, dy + 20);
    ctx.lineTo(dx + 150, dy + 20);
    ctx.stroke();
  });

  ctx.strokeStyle = "#f0f";
  ctx.beginPath();
  ctx.moveTo(50, 460);
  ctx.lineTo(450, 460);
  ctx.stroke();
}

// ======================================================
// ENGINE-KONSOLE — ALLES AUS DEM REPO
// ======================================================
function renderConsole(t){

  const q = QUANT.atom(t);
  const syn = SYN.run(t);
  const quo = QUO.state(t);
  const pyr = PYRAMIDE.flow(t);
  const ultra = KIT.pipeline(t);

  out.innerText =
    "ULTRA-KERNEL ONLINE\n\n" +
    "QUANT: " + q.atom + "\n" +
    "SYN:   " + syn.mode + "\n" +
    "QUO:   " + quo.tag + "\n" +
    "PYRA:  " + pyr.axis + "\n" +
    "ULTRA: " + ultra.out.tag + "\n";
}

// ======================================================
// LOOP — FINAL
// =================================================
